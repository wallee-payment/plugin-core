<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PluginCore Checkout Simulation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin-bottom: 2rem;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #payment-form {
            width: 100%;
            min-height: 200px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>PluginCore Checkout Simulation</h1>
        <div class="custom-payment-form">
    <h3>Custom Payment Experience</h3>
    <p>This UI is built manually, but powered by the standardized RenderService logic.</p>
    
    <!-- The container where the IFrame will be injected -->
    <div id="custom-payment-container" style="border: 1px solid #ccc; padding: 10px; border-radius: 4px;"></div>
    
    <!-- Container for validation errors -->
    <div id="custom-payment-container_errors" style="color: red; margin: 10px 0;"></div>
    
    <!-- The submit button -->
    <button id="custom-payment-container_submit" style="background-color: #28a745; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer;">
        Submit Secure Payment
    </button>
</div>

<!-- Standardized JavaScript initialization logic with CSP nonce -->
<script src="https://app-wallee.com/assets/payment/iframe-checkout-handler.js?spaceId=32088&transactionId=518706381&securityToken=1777471562972-gFDygQOraMCRfa1POPtfe886qaRqoYRsk5fpi51zQ5c-1464855412534" nonce="demo-nonce-b6a46890884b315c"></script>
<script nonce="demo-nonce-b6a46890884b315c">
    window.__walleeHandlers = window.__walleeHandlers || {};
    var handler = window.IframeCheckoutHandler(115187);
    window.__walleeHandlers['115187'] = handler;
    handler.setValidationCallback(function(validationResult) {
        var errorContainer = document.getElementById("custom-payment-container_errors");
        if (errorContainer) {
            errorContainer.innerText = "";
            if (validationResult.success) {
                handler.submit();
            } else {
                errorContainer.innerText = validationResult.errors ? validationResult.errors.join("\n") : "Validation failed.";
            }
        }
    });
    handler.create("custom-payment-container");
    var submitBtn = document.getElementById("custom-payment-container_submit");
    if (submitBtn) {
        submitBtn.addEventListener("click", function() { handler.validate(); });
    }
</script>
    </div>
</body>

</html>
